# Public mode deployment — no MongoDB or Ollama required for scraping
# Uses APP_MODE=public so reviews are NOT persisted to a database.
#
# Usage:
#   docker compose -f docker-compose.public.yml up -d
#
# Open http://localhost:3001 in your browser

services:
  app:
    image: anjanarodrigo/sentiment-intelligence:latest
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - APP_MODE=public
      - VITE_APP_MODE=public
      - OLLAMA_API_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # Pulls the LLM model on first start, then exits
  ollama-pull:
    image: curlimages/curl:latest
    depends_on:
      - ollama
    restart: "no"
    entrypoint:
      - sh
      - -c
      - |
        echo "Waiting for Ollama to be ready..."
        until curl -s http://ollama:11434/api/tags > /dev/null 2>&1; do
          sleep 2
        done
        echo "Pulling llama3.2 model..."
        curl -s http://ollama:11434/api/pull -d '{"name": "llama3.2"}'
        echo ""
        echo "Model pull complete."

volumes:
  ollama_data:
